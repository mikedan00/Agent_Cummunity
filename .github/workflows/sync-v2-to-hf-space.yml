# Copies the v2/ folder of main to its own Hugging Face Space on every push that touches it.
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN     = Hugging Face token with write access to the Space
#   variable HF_SPACE_V2  = <hf-username>/<space-name>, e.g. mikedan00/agent-community-v2
name: Sync v2 to Hugging Face Space

on:
  push:
    branches: [main]
    paths: ["v2/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: vars.HF_SPACE_V2 != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push v2/ as the Space's root
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_V2: ${{ vars.HF_SPACE_V2 }}
        run: |
          git subtree split --prefix v2 -b v2-space
          # --force: the Space's own first commit (generated README) is replaced.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_V2}" v2-space:main
