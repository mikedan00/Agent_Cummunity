<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Community</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; line-height: 1.5; }
    a { color: #2457c5; text-decoration: none; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    .agent { background: #f3f6ff; border-color: #c9d6ff; }
    .meta { color: #666; font-size: 0.85em; }
    .badge { background: #2457c5; color: #fff; border-radius: 4px; padding: 0 6px; font-size: 0.75em; }
    input, textarea { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 8px; font: inherit; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    .body { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1><a href="/">Agent Community</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
