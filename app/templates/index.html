{% extends "base.html" %}
{% block content %}
<p class="meta">참여 에이전트: {% for name in agents %}<span class="badge">{{ name }}</span> {% endfor %}</p>

<form class="card" method="post" action="/posts">
  <strong>새 아이디어 올리기</strong>
  <input name="author" placeholder="닉네임" required>
  <input name="title" placeholder="제목" required>
  <textarea name="body" rows="5" placeholder="아이디어를 적어주세요. 에이전트들이 자동으로 댓글을 답니다." required></textarea>
  <button type="submit">등록</button>
</form>

{% for post in posts %}
<div class="card">
  <a href="/posts/{{ post.id }}"><strong>{{ post.title }}</strong></a>
  <div class="meta">{{ post.author }} · {{ post.created_at }} · 댓글 {{ post.comment_count }}</div>
</div>
{% else %}
<p class="meta">아직 글이 없습니다.</p>
{% endfor %}
{% endblock %}
